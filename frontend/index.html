<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>진헬스 일일매출보고</title>
<style>
  :root { --line:#e7e7ea; --muted:#8e8e93; --text:#1c1c1e; --resv:#0369a1; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,'Malgun Gothic',sans-serif; max-width:460px; margin:0 auto;
         padding:16px 14px 40px; color:var(--text); background:#fff; }
  h1 { font-size:18px; margin:6px 0 2px; }
  .sub { display:none; }

  /* 전일 네비 (로컬 /daily-report daybar 와 동일) */
  .daybar { display:flex; align-items:center; gap:8px; margin:12px 0 4px; }
  .daybar .day-nav { border:1px solid var(--line); background:#fff; border-radius:9px;
                     width:38px; height:38px; font-size:14px; cursor:pointer; color:var(--text); flex:none; }
  .daybar .day-nav:active { background:#f0f0f2; }
  .daybar .day-nav:disabled { color:#d1d1d6; cursor:default; }
  .dlabel { flex:1; text-align:center; font-size:15px; font-weight:700; }
  .dlabel .dw { color:var(--muted); font-weight:500; }
  .dlabel .dprev { color:#b45309; font-weight:600; font-size:13px; margin-left:2px; }

  .sec { font-size:17px; color:var(--text); font-weight:700; margin:32px 2px 10px;
         display:flex; justify-content:space-between; align-items:baseline; }
  .sec .rng { font-weight:400; font-size:12px; color:var(--muted); }
  #content .sec:first-of-type { margin-top:18px; }

  .card { border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:6px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { padding:10px 10px; text-align:right; font-size:15px; letter-spacing:-0.4px; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:11px; font-weight:500; color:var(--muted); background:#fafafa; border-bottom:1px solid var(--line); letter-spacing:0; }
  tbody td { border-bottom:1px solid #f2f2f4; }
  tbody tr:last-child td { border-bottom:none; }
  .num-amt { font-size:14px; }
  .zero { color:#c7c7cc; }
  tr.total td { background:#1b3a6b; color:#fff; font-weight:700; border-top:1px solid var(--line); }
  .proj { background:#1b3a6b; color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:6px; }
  .proj .k { font-size:12px; color:#c3cede; }
  .proj .v { font-size:29px; font-weight:700; margin-top:4px; letter-spacing:-.5px; }
  .proj .u { font-size:12px; color:#c3cede; margin-top:2px; }
  .line { display:flex; justify-content:space-between; padding:11px 14px; border:1px solid var(--line);
          border-radius:12px; margin-bottom:8px; font-size:14px; }
  .line .lb { color:var(--muted); font-size:12px; }
  .line b { font-weight:700; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:140px; padding:8px 12px 4px;
          border:1px solid var(--line); border-radius:14px; }
  .bcol { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; }
  .bval { font-size:10px; color:var(--muted); margin-bottom:4px; white-space:nowrap; }
  .btrack { flex:1; width:100%; display:flex; align-items:flex-end; }
  .bfill { width:100%; background:var(--resv); border-radius:4px 4px 0 0; min-height:2px; }
  .bcol.today .bfill { background:#1b3a6b; }
  .bx { font-size:10px; color:var(--muted); margin-top:5px; text-align:center; line-height:1.3; }
  .bcol.today .bx { color:var(--text); font-weight:600; }
  .status { font-size:13px; color:var(--muted); margin-top:40px; text-align:center; }
  /* 재무 · 잔고 (보고자가 폰에서 직접 입력) */
  .fin-box { display:flex; gap:8px; align-items:center; border:1px solid var(--line);
             border-radius:12px; padding:12px 14px; }
  .fin-box input { flex:1; border:1px solid var(--line); border-radius:9px; padding:11px 12px;
                   font-size:17px; text-align:right; font-variant-numeric:tabular-nums; font-family:inherit; }
  .fin-box .unit { color:var(--muted); font-size:14px; }
  .fin-box button { padding:11px 18px; border:none; border-radius:9px; background:#1b3a6b;
                    color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  .fin-msg { font-size:12px; color:var(--muted); margin:7px 2px 0; text-align:right; }
  /* 결재 */
  .approve-bar { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line);
                 padding:14px 0 8px; margin-top:20px; }
  .approve-bar .who { font-size:13px; color:var(--muted); text-align:center; margin-bottom:10px; }
  .approve-btns { display:flex; gap:10px; }
  .approve-btns button { flex:1; padding:14px; border:none; border-radius:12px; font-size:15px;
                         font-weight:700; cursor:pointer; }
  .btn-ok { background:#1b3a6b; color:#fff; }
  .btn-no { background:#fff; color:#dc2626; border:1px solid #dc2626 !important; }
  .approve-msg { text-align:center; font-size:14px; padding:14px; border-radius:12px; margin-top:6px; }
  .approve-msg.ok { background:#ecfdf5; color:#047857; }
  .approve-msg.no { background:#fef2f2; color:#b91c1c; }
  .approve-msg.info { background:#f4f4f5; color:#3f3f46; }
  .ap-panel { border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:6px; }
  .ap-q { font-size:15px; font-weight:700; text-align:center; margin-bottom:10px; }
  .ap-panel textarea { width:100%; box-sizing:border-box; border:1px solid var(--line);
                       border-radius:10px; padding:9px 11px; font-size:14px; resize:vertical;
                       font-family:inherit; margin-bottom:10px; }
  .btn-cancel { background:#f4f4f5; color:#3f3f46; }
</style>
</head>
<body>
  <h1 id="title">일일매출보고</h1>
  <div class="sub" id="meta"></div>

  <div class="daybar" id="daybar" style="display:none">
    <button class="day-nav" id="dPrev" onclick="stepDay(-1)" aria-label="전일">◀</button>
    <div class="dlabel" id="dLabel">—</div>
    <button class="day-nav" id="dNext" onclick="stepDay(1)" aria-label="익일">▶</button>
  </div>

  <div id="content" style="display:none"></div>
  <div id="approveBox" style="display:none"></div>
  <div class="status" id="status">불러오는 중...</div>

<script>
const won = n => (n || 0).toLocaleString('ko-KR');
const cell = v => v ? won(v) : '<span class="zero">0</span>';
const WD = ['일','월','화','수','목','금','토'];

function groupTable(rep, countLabel) {
  const rows = (rep.groups || []).map(g => `
    <tr><td>${g.category}</td><td>${cell(g.cnt)}</td>
        <td class="num-amt">${cell(g.amt)}</td><td class="num-amt">${cell(g.avg)}</td></tr>`).join('');
  const t = rep.total || { cnt: 0, amt: 0, avg: 0 };
  return `<div class="card"><table>
    <thead><tr><th>구분</th><th>${countLabel || '명수'}</th><th>금액</th><th>평균단가</th></tr></thead>
    <tbody>${rows}
      <tr class="total"><td>합계</td><td>${won(t.cnt)}</td>
      <td class="num-amt">${won(t.amt)}</td><td class="num-amt">${won(t.avg)}</td></tr>
    </tbody></table></div>`;
}

function bars(items) {
  if (!items || !items.length) return '';
  const max = Math.max(1, ...items.map(it => it.amt));
  const man = n => n >= 10000 ? Math.round(n / 10000).toLocaleString('ko-KR') + '만' : (n ? won(n) : '0');
  const cols = items.map((it, i) => {
    const h = Math.round(it.amt / max * 100);
    const today = i === items.length - 1;
    return `<div class="bcol ${today ? 'today' : ''}">
      <div class="bval">${man(it.amt)}</div>
      <div class="btrack"><div class="bfill" style="height:${h}%"></div></div>
      <div class="bx">${it.date}<br>(${it.weekday})</div></div>`;
  }).join('');
  return `<div class="bars">${cols}</div>`;
}

// 로컬 /daily-report 와 동일한 구성·라벨·순서로 렌더
function renderNew(r, receivedAt) {
  const p = (r.report_date || '').split('-');
  document.getElementById('title').textContent =
    (p.length === 3 ? `${+p[1]}월${+p[2]}일 ` : '') + '진헬스 일일매출보고';

  const m = r.monthly || {}, nx = r.next_month || {};
  const pj = m.projected || { cnt: 0, amt: 0 };
  const sTot = (m.sales && m.sales.total) || m.sales_total || {};
  const uTot = (m.upcoming && m.upcoming.total) || m.upcoming_total || {};
  let html = '';

  // 금일
  html += `<div class="sec">수검인원 (실검진 · 총검사금액)</div>${groupTable(r.today || {})}`;

  // 월간 — 예상매출 카드
  html += `<div class="proj"><div class="k">예상 매출 · 이번달 매출 + 남은 예약</div>
    <div class="v">${won(pj.amt)}원</div>
    <div class="u">${won(pj.cnt)}명 (매출 ${won(sTot.cnt)} + 예약 ${won(uTot.cnt)})</div></div>`;

  // 이번달 매출
  if (m.sales && m.sales.groups) {
    html += `<div class="sec">이번달 매출 <span class="rng">${m.sales_period || ''}</span></div>${groupTable(m.sales)}`;
  } else {
    html += `<div class="line"><span class="lb">이번달 매출 ${m.sales_period || ''}</span>
      <span><b>${won(sTot.amt)}</b>원 · ${won(sTot.cnt)}명</span></div>`;
  }

  // 남은 예약
  if (m.upcoming && m.upcoming.groups) {
    html += `<div class="sec">남은 예약 <span class="rng">${m.upcoming_period || ''}</span></div>${groupTable(m.upcoming, '예약')}`;
  } else {
    html += `<div class="line"><span class="lb">남은 예약 ${m.upcoming_period || ''}</span>
      <span><b>${won(uTot.amt)}</b>원 · ${won(uTot.cnt)}명</span></div>`;
  }

  // 1일 예약금액 (최근 7일)
  if (r.daily_res && r.daily_res.length) {
    html += `<div class="sec">1일 예약금액 <span class="rng">최근 7일 · 전일 대비 순증가</span></div>${bars(r.daily_res)}`;
  }

  // 익월 예약
  html += `<div class="sec">익월 예약 <span class="rng">${nx.month || ''} ${nx.period || ''}</span></div>`;
  if (nx.reservation && nx.reservation.groups) {
    html += groupTable(nx.reservation, '예약');
  } else {
    html += `<div class="line"><span class="lb">예약 합계</span>
      <span><b>${won((nx.total || {}).amt)}</b>원 · ${won((nx.total || {}).cnt)}명</span></div>`;
  }

  document.getElementById('content').innerHTML = html;
}

// 재무 · 잔고 — 보고자가 폰에서 직접 입력해 맨 아래에 저장 (날짜별)
function renderBalance(date, balance) {
  const has = balance !== null && balance !== undefined && balance !== '';
  const wrap = document.createElement('div');
  wrap.innerHTML =
    `<div class="sec">재무 · 잔고 <span class="rng">보고자 직접 입력</span></div>
     <div class="fin-box">
       <input id="balInput" type="text" inputmode="numeric" placeholder="잔고 입력"
              value="${has ? won(balance) : ''}">
       <span class="unit">원</span>
       <button id="balSave">저장</button>
     </div>
     <div class="fin-msg" id="balMsg">${has ? '저장됨' : '아직 입력되지 않음'}</div>`;
  document.getElementById('content').appendChild(wrap);
  const input = wrap.querySelector('#balInput');
  input.addEventListener('input', () => {
    const n = input.value.replace(/[^0-9]/g, '');
    input.value = n ? Number(n).toLocaleString('ko-KR') : '';
  });
  wrap.querySelector('#balSave').onclick = () => {
    const raw = input.value.replace(/[^0-9]/g, '');
    const msg = wrap.querySelector('#balMsg');
    msg.textContent = '저장 중…';
    fetch(`/api/reports/${encodeURIComponent(date)}/balance?k=${encodeURIComponent(kTok)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ balance: raw === '' ? null : Number(raw) })
    }).then(r => r.json()).then(d => {
      msg.textContent = d.success ? '✅ 저장되었습니다' : ('⚠️ ' + (d.error || '저장 실패'));
    }).catch(e => { msg.textContent = '⚠️ ' + e.message; });
  };
}

// 구 형식(월별 cnt/amt 12칸) 폴백 — 새 데이터 push 전 호환
function renderLegacy(r, receivedAt) {
  document.getElementById('title').textContent = `일일보고 ${r.report_date || ''}`;
  const cnt = r.cnt || [], amt = r.amt || [];
  let sumC = 0, sumA = 0, rows = '';
  for (let i = 0; i < 12; i++) {
    const c = cnt[i] || 0, a = amt[i] || 0; sumC += c; sumA += a;
    if (!c && !a) continue;
    rows += `<tr><td>${i + 1}월</td><td>${won(c)}</td><td class="num-amt">${won(a)}</td></tr>`;
  }
  document.getElementById('content').innerHTML = `<div class="card"><table>
    <thead><tr><th>월</th><th>건수</th><th>금액</th></tr></thead>
    <tbody>${rows}<tr class="total"><td>합계</td><td>${won(sumC)}</td>
    <td class="num-amt">${won(sumA)}</td></tr></tbody></table></div>
    ${r.memo ? `<div class="sec">메모</div><div class="line">${r.memo}</div>` : ''}`;
}

// ── 확인 / 수정 요청 ──
function renderApprove(reportDate, token) {
  const box = document.getElementById('approveBox');
  box.style.display = 'block';
  box.className = 'approve-bar';
  box.innerHTML = `
    <div class="who">보고서를 검토하셨으면 아래에서 선택해 주세요.</div>
    <div class="approve-btns" id="apMain">
      <button class="btn-ok" id="apConfirm">확인</button>
      <button class="btn-no" id="apRevise">수정 요청</button>
    </div>
    <div id="apPanel"></div>
    <div id="apMsg"></div>`;
  const panel = document.getElementById('apPanel');
  const msg = document.getElementById('apMsg');
  const main = document.getElementById('apMain');

  function showPanel(isConfirm) {
    main.style.display = 'none';
    panel.innerHTML = `
      <div class="ap-panel">
        <div class="ap-q">${isConfirm ? '내용을 확인하셨습니까?' : '수정을 요청하시겠습니까?'}</div>
        <textarea id="apNote" rows="2" placeholder="${isConfirm ? '남기실 의견이 있으면 입력하세요 (선택)' : '수정 의견을 입력하세요 (선택)'}"></textarea>
        <div class="approve-btns">
          <button class="${isConfirm ? 'btn-ok' : 'btn-no'}" id="apDo">${isConfirm ? '확인' : '수정 요청'}</button>
          <button class="btn-cancel" id="apCancel">취소</button>
        </div>
      </div>`;
    document.getElementById('apCancel').onclick = () => { panel.innerHTML = ''; main.style.display = 'flex'; };
    document.getElementById('apDo').onclick = () => {
      const note = (document.getElementById('apNote').value || '').trim();
      submit(isConfirm ? 'approve' : 'reject', note);
    };
  }

  function submit(action, reason) {
    document.getElementById('apDo').disabled = true;
    msg.className = 'approve-msg info'; msg.textContent = '처리 중…';
    fetch(`/api/approvals/${encodeURIComponent(reportDate)}/action`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, action, reason })
    }).then(r => r.json()).then(d => {
      panel.innerHTML = '';
      if (d.success && d.action === 'approve') {
        msg.className = 'approve-msg ok';
        msg.textContent = d.completed
          ? '✅ 최종 확인 완료. 보고가 마감되었습니다.'
          : '✅ 확인했습니다. 다음 담당자에게 전달됩니다.';
      } else if (d.success && d.action === 'reject') {
        msg.className = 'approve-msg no';
        msg.textContent = '📝 수정 요청이 담당자에게 전달되었습니다.';
      } else {
        msg.className = 'approve-msg no';
        msg.textContent = '⚠️ ' + (d.error || '처리 실패');
        main.style.display = 'flex';
      }
    }).catch(e => { msg.className = 'approve-msg no'; msg.textContent = '⚠️ ' + e.message; main.style.display = 'flex'; });
  }

  document.getElementById('apConfirm').onclick = () => showPanel(true);
  document.getElementById('apRevise').onclick = () => showPanel(false);
}

function showApproveMsg(kind, text) {
  const box = document.getElementById('approveBox');
  box.style.display = 'block';
  box.className = 'approve-bar';
  box.innerHTML = `<div class="approve-msg ${kind}">${text}</div>`;
}

// 링크 재오픈 시: 내 결재 상태를 먼저 확인해 버튼/문구를 결정
function setupApprove(reportDate, token) {
  fetch(`/api/approvals/${encodeURIComponent(reportDate)}/mystate?token=${encodeURIComponent(token)}`)
    .then(r => r.json()).then(st => {
      if (!st.valid) return;                       // 잘못된 링크 → 결재 UI 없이 보고서만
      if (st.my_state === 'approved') showApproveMsg('ok', '✅ 이미 확인하신 보고입니다.');
      else if (st.my_state === 'rejected') showApproveMsg('no', '📝 이미 수정 요청하신 보고입니다.');
      else if (st.is_current) renderApprove(reportDate, token);
      else if (st.is_waiting) showApproveMsg('info', '앞 단계 확인이 끝나면 결재하실 수 있습니다.');
      else showApproveMsg('info', '이미 종료된 보고입니다.');
    }).catch(() => renderApprove(reportDate, token));  // 조회 실패 시 버튼 노출(서버가 최종 검증)
}

// ═══════════════ 날짜 이동 (전일 보기) ═══════════════
let kTok = '';
let allDates = [];        // 발행된 날짜 (내림차순)
let curDate = null;       // 현재 보고 있는 report_date
let approveToken = null;  // 결재 토큰 (링크에 있을 때만)
let approveDate = null;   // 결재 대상 날짜 (이 날짜에서만 결재 UI 노출)

async function fetchDates() {
  try {
    const r = await fetch(`/api/reports?k=${encodeURIComponent(kTok)}`);
    const d = await r.json();
    if (d.success && Array.isArray(d.dates)) allDates = d.dates;
  } catch (e) { /* 목록 실패 시 네비 비활성 */ }
}

function updateDaybar() {
  const bar = document.getElementById('daybar');
  if (!curDate) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const p = curDate.split('-');
  const wd = WD[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  const isLatest = allDates.length ? curDate === allDates[0] : true;
  document.getElementById('dLabel').innerHTML =
    `${+p[1]}월 ${+p[2]}일 <span class="dw">(${wd})</span>` +
    (isLatest ? '' : ' <span class="dprev">· 전일보고</span>');
  const idx = allDates.indexOf(curDate);
  // 내림차순: 더 과거 = idx+1, 더 최근 = idx-1
  document.getElementById('dPrev').disabled = !(idx >= 0 && idx < allDates.length - 1);
  document.getElementById('dNext').disabled = !(idx > 0);
}

function stepDay(delta) {  // -1 = 전일(과거), +1 = 익일(최근)
  const idx = allDates.indexOf(curDate);
  if (idx < 0) return;
  const ni = idx + (delta < 0 ? 1 : -1);
  if (ni < 0 || ni >= allDates.length) return;
  loadReport(allDates[ni]);
}

function gateApproval() {
  const box = document.getElementById('approveBox');
  if (approveToken && curDate && curDate === approveDate) {
    setupApprove(approveDate, approveToken);
  } else {
    box.style.display = 'none';
    box.innerHTML = '';
  }
}

async function loadReport(date) {
  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('content');
  statusEl.style.display = 'block';
  statusEl.textContent = '불러오는 중...';
  const url = date ? `/api/reports/${date}?k=${encodeURIComponent(kTok)}`
                   : `/api/reports/latest?k=${encodeURIComponent(kTok)}`;
  try {
    const resp = await fetch(url);
    if (resp.status === 403) { statusEl.textContent = '접근 권한이 없습니다.'; return; }
    const data = await resp.json();
    if (!data.success) { statusEl.textContent = data.error || '조회 실패'; return; }
    curDate = data.report.report_date;
    (data.report.today ? renderNew : renderLegacy)(data.report, data.received_at);
    renderBalance(curDate, data.balance);
    contentEl.style.display = 'block';
    statusEl.textContent = ''; statusEl.style.display = 'none';
    updateDaybar();
    gateApproval();
  } catch (e) {
    statusEl.textContent = '서버에 연결할 수 없습니다.';
  }
}

(async function () {
  const q = new URLSearchParams(location.search);
  kTok = q.get('k') || '';
  const dateParam = q.get('date');
  approveToken = q.get('approve');
  approveDate = dateParam || null;
  await fetchDates();               // 발행 날짜 목록 (전일 네비용)
  await loadReport(dateParam);      // dateParam 없으면 최신
  if (approveToken && !approveDate) {
    approveDate = curDate;          // 링크에 날짜가 없으면 최신 보고가 결재 대상
    gateApproval();
  }
})();
</script>
