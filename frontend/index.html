<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>진헬스건강검진센터 일일보고</title>
<style>
  :root { --line:#e7e7ea; --muted:#8e8e93; --text:#1c1c1e; --resv:#0369a1; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,'Malgun Gothic',sans-serif; max-width:460px; margin:0 auto;
         padding:16px 14px 40px; color:var(--text); background:#fff; }
  h1 { font-size:18px; margin:6px 0 2px; text-align:center; }
  .sub { display:none; }

  /* 전일 네비 (로컬 /daily-report daybar 와 동일) */
  .daybar { display:flex; align-items:center; gap:8px; margin:12px 0 4px; }
  .daybar .day-nav { border:1px solid var(--line); background:#fff; border-radius:9px;
                     width:38px; height:38px; font-size:14px; cursor:pointer; color:var(--text); flex:none; }
  .daybar .day-nav:active { background:#f0f0f2; }
  .daybar .day-nav:disabled { color:#d1d1d6; cursor:default; }
  .dlabel { flex:1; text-align:center; font-size:15px; font-weight:700; }
  .dlabel .dw { color:var(--muted); font-weight:500; }
  .dlabel .dprev { color:#b45309; font-weight:600; font-size:13px; margin-left:2px; }

  .sec { font-size:17px; color:var(--text); font-weight:700; margin:32px 2px 10px;
         display:flex; justify-content:space-between; align-items:baseline; }
  .sec .rng { font-weight:400; font-size:12px; color:var(--muted); }
  #content .sec:first-of-type { margin-top:18px; }

  .card { border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:6px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { padding:10px 10px; text-align:right; font-size:15px; letter-spacing:-0.4px; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-size:11px; font-weight:500; color:var(--muted); background:#fafafa; border-bottom:1px solid var(--line); letter-spacing:0; }
  tbody td { border-bottom:1px solid #f2f2f4; }
  tbody tr:last-child td { border-bottom:none; }
  .num-amt { font-size:14px; }
  .zero { color:#c7c7cc; }
  tr.total td { background:#1b3a6b; color:#fff; font-weight:700; border-top:1px solid var(--line); }
  .proj { background:#1b3a6b; color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:6px; }
  .proj .k { font-size:12px; color:#c3cede; }
  .proj .v { font-size:29px; font-weight:700; margin-top:4px; letter-spacing:-.5px; }
  .proj .u { font-size:12px; color:#c3cede; margin-top:2px; }
  .line { display:flex; justify-content:space-between; padding:11px 14px; border:1px solid var(--line);
          border-radius:12px; margin-bottom:8px; font-size:14px; }
  .line .lb { color:var(--muted); font-size:12px; }
  .line b { font-weight:700; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:140px; padding:8px 12px 4px;
          border:1px solid var(--line); border-radius:14px; }
  .bcol { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; }
  .bval { font-size:10px; color:var(--muted); margin-bottom:4px; white-space:nowrap; }
  .btrack { flex:1; width:100%; display:flex; align-items:flex-end; }
  .bfill { width:100%; background:var(--resv); border-radius:4px 4px 0 0; min-height:2px; }
  .bcol.today .bfill { background:#1b3a6b; }
  .bx { font-size:10px; color:var(--muted); margin-top:5px; text-align:center; line-height:1.3; }
  .bcol.today .bx { color:var(--text); font-weight:600; }
  .status { font-size:13px; color:var(--muted); margin-top:40px; text-align:center; }
  /* 재무 · 잔고 (보고자가 폰에서 직접 입력) */
  .fin-box { display:flex; gap:8px; align-items:center; border:1px solid var(--line);
             border-radius:12px; padding:12px 14px; }
  .fin-box input { flex:1; border:1px solid var(--line); border-radius:9px; padding:11px 12px;
                   font-size:17px; text-align:right; font-variant-numeric:tabular-nums; font-family:inherit; }
  .fin-box .unit { color:var(--muted); font-size:14px; }
  .fin-box button { padding:11px 18px; border:none; border-radius:9px; background:#1b3a6b;
                    color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  .fin-msg { font-size:12px; color:var(--muted); margin:7px 2px 0; text-align:right; }
  /* 결재 */
  .approve-bar { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line);
                 padding:14px 0 8px; margin-top:20px; }
  .approve-bar .who { font-size:13px; color:var(--muted); text-align:center; margin-bottom:10px; }
  .approve-btns { display:flex; gap:10px; }
  .approve-btns button { flex:1; padding:14px; border:none; border-radius:12px; font-size:15px;
                         font-weight:700; cursor:pointer; }
  .btn-ok { background:#1b3a6b; color:#fff; }
  .btn-no { background:#fff; color:#dc2626; border:1px solid #dc2626 !important; }
  .approve-msg { text-align:center; font-size:14px; padding:14px; border-radius:12px; margin-top:6px; }
  .approve-msg.ok { background:#ecfdf5; color:#047857; }
  .approve-msg.no { background:#fef2f2; color:#b91c1c; }
  .approve-msg.info { background:#f4f4f5; color:#3f3f46; }
  .ap-panel { border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:6px; }
  .ap-q { font-size:15px; font-weight:700; text-align:center; margin-bottom:10px; }
  .ap-panel textarea { width:100%; box-sizing:border-box; border:1px solid var(--line);
                       border-radius:10px; padding:9px 11px; font-size:14px; resize:vertical;
                       font-family:inherit; margin-bottom:10px; }
  .btn-cancel { background:#f4f4f5; color:#3f3f46; }
  /* 작년 대비(YoY) 비교 */
  .cmp-chip { font-weight:600; font-size:11px; color:#fff; background:#1b3a6b; padding:2px 9px;
              border-radius:20px; white-space:nowrap; margin-left:6px; cursor:pointer; }
  tr.drill { cursor:pointer; }
  tr.drill:active td { background:#f2f5fa; }
  .chev { color:var(--muted); font-weight:400; }
  #cmpModal { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100;
              align-items:center; justify-content:center; padding:14px; }
  .cmp-sheet { background:#fff; border-radius:16px; width:100%; max-width:440px; max-height:90vh;
               overflow-y:auto; padding:14px 16px 20px; }
  .cmp-hd { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .cmp-t { font-size:17px; font-weight:700; } .cmp-s { font-size:12px; color:var(--muted); margin-top:2px; }
  .cmp-x { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .cmp-yoy { display:flex; gap:10px; margin:6px 0 12px; }
  .cmp-yoy > div { flex:1; border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center; }
  .cmp-yoy > div.cur { border-color:#1b3a6b; }
  .cmp-yoy .yr { font-size:11px; color:var(--muted); } .cmp-yoy .val { font-size:19px; font-weight:700; margin-top:3px; }
  .cmp-yoy .sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .cmp-delta { text-align:center; font-size:15px; font-weight:700; margin-bottom:12px; }
  .cmp-delta.up { color:#0a7d34; } .cmp-delta.down { color:#dc2626; }
  .cmp-legend { display:flex; gap:18px; justify-content:center; font-size:12px; color:var(--muted); margin-top:10px; }
  .cmp-legend b { color:var(--text); }
  .leg-line { display:inline-block; width:16px; height:0; vertical-align:middle; margin-right:5px; }
  .cmp-foot { text-align:center; font-size:12px; color:var(--muted); margin-top:12px; }
  /* 분류 상세 3지표 비교표 */
  .cmp-metrics { width:100%; border-collapse:collapse; margin:2px 0 8px; }
  .cmp-metrics th { font-size:11px; color:var(--muted); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line); text-align:right; }
  .cmp-metrics th:first-child { text-align:left; }
  .cmp-metrics td { font-size:13px; padding:9px 4px; text-align:right; border-bottom:1px solid #f2f2f4; }
  .cmp-metrics td.mk { text-align:left; color:var(--muted); font-weight:600; }
  .cmp-metrics td.dl { font-weight:700; } .cmp-metrics td.dl.up { color:#0a7d34; } .cmp-metrics td.dl.down { color:#dc2626; }
  /* 1일 예약금액 7일 표 */
  .dr-table { width:100%; border-collapse:collapse; margin-bottom:8px; }
  .dr-table th { font-size:11px; color:var(--muted); font-weight:600; text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); }
  .dr-table th:last-child { text-align:right; }
  .dr-table td { font-size:13px; padding:7px 6px; border-bottom:1px solid #f4f4f6; }
  .dr-table td.num-amt { text-align:right; }
  .dr-table tr.today td { font-weight:700; color:#1b3a6b; }
  /* 월 매출 예측 */
  .fc-cards { display:flex; gap:8px; margin-bottom:10px; }
  .fc-cards > div { flex:1; border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; }
  .fc-cards > div.hl { border-color:#1b3a6b; background:#f6f9fd; }
  .fc-cards .k { font-size:10.5px; color:var(--muted); } .fc-cards .v { font-size:16px; font-weight:700; margin-top:3px; }
  .fc-cards .s { font-size:10px; color:#0a7d34; margin-top:2px; }
</style>
</head>
<body>
  <h1 id="title">진헬스건강검진센터 일일보고</h1>
  <div class="sub" id="meta"></div>

  <div class="daybar" id="daybar" style="display:none">
    <button class="day-nav" id="dPrev" onclick="stepDay(-1)" aria-label="전일">◀</button>
    <div class="dlabel" id="dLabel">—</div>
    <button class="day-nav" id="dNext" onclick="stepDay(1)" aria-label="익일">▶</button>
  </div>

  <div id="content" style="display:none"></div>
  <div id="approveBox" style="display:none"></div>

  <div id="cmpModal" style="display:none" onclick="closeCmp()">
    <div class="cmp-sheet">
      <div class="cmp-hd" title="눌러서 닫기" style="cursor:pointer">
        <div><div class="cmp-t" id="cmpTitle">작년 대비</div><div class="cmp-s" id="cmpSub"></div></div>
        <button class="cmp-x" onclick="closeCmp()">닫기</button>
      </div>
      <div id="cmpBody"></div>
    </div>
  </div>
  <div class="status" id="status">불러오는 중...</div>

<script>
const won = n => (n || 0).toLocaleString('ko-KR');
const cell = v => v ? won(v) : '<span class="zero">0</span>';

// ── 작년 대비(YoY) 비교 — payload의 r.compare 를 그대로 렌더 ──
const CMP_CFG = {
  exam:     { title: '수검인원 · 작년 대비',   use: 'cnt', cumul: false, key: 'month' },
  revenue:  { title: '이번달 매출 · 작년 대비', use: 'amt', cumul: true,  key: 'month' },
  upcoming: { title: '남은 예약 · 작년 대비',   use: 'amt', cumul: true,  key: 'upcoming' },
  next:     { title: '익월 예약 · 작년 대비',   use: 'amt', cumul: true,  key: 'next' },
};
function chip(metric) {
  const c = (window._rep || {}).compare || {};
  const d = c[CMP_CFG[metric].key];
  return (d && d.days && d.days.length)
    ? ` <span class="cmp-chip" onclick="openCmp('${metric}')">작년비교 ▸</span>` : '';
}
function closeCmp() { document.getElementById('cmpModal').style.display = 'none'; }
function openCmp(metric) {
  const cfg = CMP_CFG[metric];
  const d = ((window._rep || {}).compare || {})[cfg.key];
  const mo = d ? (+(d.period || '').slice(0, 2) || '') : '';
  const titleMap = { revenue: `${mo}월 매출 · 작년 대비`, next: `${mo}월 예약 · 작년 대비` };
  showCmp(d, { useCnt: cfg.use === 'cnt', cumul: cfg.cumul, title: titleMap[metric] || cfg.title });
}
// 연도 라벨 (올해/작년 문구 대신 연도만; '예약'·'실적' 등 수식어 유지)
function yrLabels(d) {
  const cq = (d.cur_label || '').replace('올해', '').trim();
  const pq = (d.prev_label || '').replace('작년', '').trim();
  return { cur: `${d.cur_year}년${cq ? ' ' + cq : ''}`, prev: `${d.prev_year}년${pq ? ' ' + pq : ''}` };
}
const eok = v => v >= 100000000 ? (v / 100000000).toFixed(1) + '억'
  : v >= 10000 ? Math.round(v / 10000).toLocaleString('ko-KR') + '만' : won(v);
// 분류 상세: compare[cmpKey][분류] → 명수·금액·평균단가 3지표 표
// cmpKey: categories(매출/수검) · categories_upcoming(남은예약) · categories_next(익월예약)
function openCatCmp(cmpKey, cat) {
  const cats = ((window._rep || {}).compare || {})[cmpKey] || {};
  showCmp(cats[cat], { useCnt: true, cumul: false, title: cat, metrics: true });
}
function showCmp(d, opt) {
  if (!d || !d.days) return;
  const useCnt = opt.useCnt, L = yrLabels(d);
  let cur = [], prev = [], ac = 0, ap = 0; const curB = [], prevB = [];
  d.days.forEach(x => {
    const cv = useCnt ? x.cur_cnt : x.cur_amt, pv = useCnt ? x.prev_cnt : x.prev_amt;
    if (opt.cumul) { ac += cv; ap += pv; cur.push(ac); prev.push(ap); } else { cur.push(cv); prev.push(pv); }
    curB.push(x.cur_bday === undefined ? true : !!x.cur_bday);
    prevB.push(x.prev_bday === undefined ? true : !!x.prev_bday);
  });
  const t = d.totals || {};
  const man = v => v >= 10000 ? Math.round(v / 10000).toLocaleString('ko-KR') + '만' : won(v);
  const chart = cmpChart(d.days.map(x => x.day), cur, prev, useCnt ? won : man, curB, prevB);
  const legend = `
    <div class="cmp-legend">
      <span><span class="leg-line" style="border-top:3px solid #1b3a6b;"></span><b>${L.cur}</b></span>
      <span><span class="leg-line" style="border-top:3px dashed #c7c7cc;"></span>${L.prev}</span>
    </div>`;
  document.getElementById('cmpTitle').textContent = opt.title;
  document.getElementById('cmpSub').textContent = `${d.period} · ${L.cur} vs ${L.prev}`;

  let body;
  if (opt.metrics) {
    const cAvg = t.cur_cnt ? Math.round(t.cur_amt / t.cur_cnt) : 0;
    const pAvg = t.prev_cnt ? Math.round(t.prev_amt / t.prev_cnt) : 0;
    const dl = (c, p) => { const r = p ? (c - p) / p * 100 : 0, u = r >= 0;
      return `<td class="dl ${u ? 'up' : 'down'}">${p ? (u ? '▲' : '▼') + Math.abs(r).toFixed(1) + '%' : '–'}</td>`; };
    const row = (lb, c, p, fmt) => `<tr><td class="mk">${lb}</td><td>${fmt(p)}</td><td>${fmt(c)}</td>${dl(c, p)}</tr>`;
    body = `
      <table class="cmp-metrics">
        <thead><tr><th></th><th>${L.prev}</th><th>${L.cur}</th><th>증감</th></tr></thead>
        <tbody>
          ${row('명수', t.cur_cnt, t.prev_cnt, v => won(v) + '명')}
          ${row('금액', t.cur_amt, t.prev_amt, eok)}
          ${row('평균단가', cAvg, pAvg, v => won(v) + '원')}
        </tbody>
      </table>${chart}${legend}
      <div class="cmp-foot">일별 인원 · ${d.period}</div>`;
  } else {
    const curTot = useCnt ? t.cur_cnt : t.cur_amt, prevTot = useCnt ? t.prev_cnt : t.prev_amt;
    const curN = Math.max(1, t.cur_days || d.days.length), prevN = Math.max(1, t.prev_days || d.days.length);
    const unit = useCnt ? '명' : '원';
    const fmtBig = v => `${won(v)}${unit}`;
    const fmtAvg = v => useCnt ? `평균 ${Math.round(v * 10) / 10}명/일` : `평균 ${won(Math.round(v))}원/일`;
    const pct = prevTot ? (curTot - prevTot) / prevTot * 100 : 0, up = pct >= 0;
    body = `
      <div class="cmp-yoy">
        <div class="cur"><div class="yr">${L.cur}</div>
          <div class="val">${fmtBig(curTot)}</div><div class="sub">${fmtAvg(curTot / curN)}</div></div>
        <div><div class="yr">${L.prev}</div>
          <div class="val">${fmtBig(prevTot)}</div><div class="sub">${fmtAvg(prevTot / prevN)}</div></div>
      </div>
      <div class="cmp-delta ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}% <span style="color:var(--muted);font-weight:400;">(${L.prev} 대비)</span></div>
      ${chart}${legend}
      <div class="cmp-foot">${opt.cumul ? '일별 누적' : '일별'} ${useCnt ? '인원' : '금액'} · ${d.period}</div>`;
  }
  document.getElementById('cmpBody').innerHTML = body;
  document.getElementById('cmpModal').style.display = 'flex';
}
function cmpChart(labels, cur, prev, fmtY, curB, prevB) {
  const W = 360, H = 210, pl = 46, pr = 12, pt = 12, pb = 26, n = labels.length;
  const bv = (a, B) => a.filter((_, i) => !B || B[i]);
  const maxV = Math.max(1, ...bv(cur, curB), ...bv(prev, prevB));
  const X = i => pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1)), Y = v => H - pb - (v / maxV) * (H - pt - pb);
  // 비영업일 꼭짓점 생략하고 앞뒤 영업일을 직선 연결(고립점 방지)
  const path = (a, B) => { let s = '', st = false; a.forEach((v, i) => { if (B && !B[i]) return; s += (st ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); st = true; }); return s; };
  const dots = (a, B, c) => a.map((v, i) => (B && !B[i]) ? '' : `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="${c}"/>`).join('');
  const grid = [0, 0.5, 1].map(f => { const yy = Y(maxV * f);
    return `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W - pr}" y2="${yy.toFixed(1)}" stroke="#eee"/>`
         + `<text x="${pl - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#aaa">${fmtY(Math.round(maxV * f))}</text>`; }).join('');
  const step = Math.max(1, Math.ceil(n / 10));
  const xl = labels.map((lb, i) => (i % step === 0 || i === n - 1)
    ? `<text x="${X(i).toFixed(1)}" y="${H - pb + 15}" text-anchor="middle" font-size="9" fill="#aaa">${lb}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${grid}${xl}
    <path d="${path(prev, prevB)}" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>
    <path d="${path(cur, curB)}" fill="none" stroke="#1b3a6b" stroke-width="2.5" stroke-linejoin="round"/>${dots(cur, curB, '#1b3a6b')}</svg>`;
}
const WD = ['일','월','화','수','목','금','토'];

function groupTable(rep, countLabel, cmpKey) {
  const cats = cmpKey ? (((window._rep || {}).compare || {})[cmpKey] || {}) : {};
  const rows = (rep.groups || []).map(g => {
    const cd = cats[g.category];
    const has = cd && cd.days && cd.days.length;
    const attr = has ? ` class="drill" onclick="openCatCmp('${cmpKey}','${g.category}')"` : '';
    const chev = has ? ' <span class="chev">›</span>' : '';
    return `
    <tr${attr}><td>${g.category}${chev}</td><td>${cell(g.cnt)}</td>
        <td class="num-amt">${cell(g.amt)}</td><td class="num-amt">${cell(g.avg)}</td></tr>`;
  }).join('');
  const t = rep.total || { cnt: 0, amt: 0, avg: 0 };
  return `<div class="card"><table>
    <thead><tr><th>구분</th><th>${countLabel || '명수'}</th><th>금액</th><th>평균단가</th></tr></thead>
    <tbody>${rows}
      <tr class="total"><td>합계</td><td>${won(t.cnt)}</td>
      <td class="num-amt">${won(t.amt)}</td><td class="num-amt">${won(t.avg)}</td></tr>
    </tbody></table></div>`;
}

// ── 월 매출 예측 (payload의 r.forecast) ──
function forecastBlock(d) {
  const eok = v => v >= 100000000 ? (v / 100000000).toFixed(2) + '억'
    : v >= 10000 ? Math.round(v / 10000).toLocaleString('ko-KR') + '만' : won(v);
  const uplift = (d.gap_total || 0) - (d.simple_total || 0);
  const futRes = (d.simple_total || 0) - (d.realized_total || 0);
  return `<div class="fc-cards">
      <div><div class="k">매출</div><div class="v">${eok(d.realized_total)}</div></div>
      <div><div class="k">예약</div><div class="v">${eok(futRes)}</div></div>
      <div><div class="k">예측</div><div class="v">${eok(uplift)}</div></div>
    </div>
    ${fcChart(d)}
    <div class="cmp-legend">
      <span><span class="leg-line" style="border-top:3px solid #1b3a6b;"></span><b>실적</b></span>
      <span><span class="leg-line" style="border-top:3px dashed #1b3a6b;"></span>예상(갭)</span>
      <span><span class="leg-line" style="border-top:2px dotted #c7c7cc;"></span>예약만</span>
      <span><span class="leg-line" style="border-top:2px solid #e08a3c;"></span>작년(${d.prev_year || ''})</span>
    </div>`;
}
function fcChart(d) {
  const W = 360, H = 220, pl = 48, pr = 12, pt = 12, pb = 26, n = d.days.length;
  const all = [...d.realized, ...d.simple, ...d.gap, ...(d.prev || [])].filter(v => v != null);
  const maxV = Math.max(1, ...all);
  const X = i => pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1)), Y = v => H - pb - (v / maxV) * (H - pt - pb);
  const fp = a => { let s = '', st = false; a.forEach((v, i) => { if (v == null) { st = false; return; } s += (st ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); st = true; }); return s; };
  const man = v => v >= 100000000 ? (v / 100000000).toFixed(1) + '억' : Math.round(v / 10000).toLocaleString('ko-KR') + '만';
  const grid = [0, 0.5, 1].map(f => { const yy = Y(maxV * f);
    return `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W - pr}" y2="${yy.toFixed(1)}" stroke="#eee"/>`
         + `<text x="${pl - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#aaa">${man(maxV * f)}</text>`; }).join('');
  const step = Math.max(1, Math.ceil(n / 12));
  const xl = d.days.map((lb, i) => (i % step === 0 || i === n - 1)
    ? `<text x="${X(i).toFixed(1)}" y="${H - pb + 15}" text-anchor="middle" font-size="9" fill="#aaa">${lb}</text>` : '').join('');
  const to = (d.today_ord != null && d.today_ord >= 0) ? d.today_ord : -1;
  const marker = to >= 0
    ? `<line x1="${X(to).toFixed(1)}" y1="${pt}" x2="${X(to).toFixed(1)}" y2="${H - pb}" stroke="#dcdce0" stroke-dasharray="2 2"/>` : '';
  const prevPath = d.prev ? `<path d="${fp(d.prev)}" fill="none" stroke="#e08a3c" stroke-width="1.8" stroke-linejoin="round"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${grid}${xl}${marker}
    ${prevPath}
    <path d="${fp(d.simple)}" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-dasharray="2 3"/>
    <path d="${fp(d.gap)}" fill="none" stroke="#1b3a6b" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="${fp(d.realized)}" fill="none" stroke="#1b3a6b" stroke-width="2.6" stroke-linejoin="round"/>
  </svg>`;
}

// 1일 예약금액: 표(일별 유입) + 추세 그래프([그날~연말] 예약평균/영업일) + 작년 같은시점 기대선
function bars(items, trend, guide) {
  if (!items || !items.length) return '';
  const rows = items.map((it, i) => `
    <tr${i === items.length - 1 ? ' class="today"' : ''}>
      <td>${it.date} (${it.weekday})</td><td class="num-amt">${won(it.amt)}원</td></tr>`).join('');
  return `<div class="card"><table class="dr-table">
      <thead><tr><th>날짜</th><th>예약금액</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="font-size:12px;color:var(--muted);margin:8px 2px 2px;">예약 평균 추세 <span style="font-size:11px;">· 그날~연말 예약 ÷ 영업일 · <b style="color:#e03131;">점선=작년 같은시점</b></span></div>
    <div class="cmp-chart">${resvTrendChart(trend || [], guide)}</div></div>`;
}
function resvTrendChart(pts, guide) {
  if (!pts.length) return '';
  const W = 360, H = 150, pl = 44, pr = 12, pt = 12, pb = 24, n = pts.length;
  const vals = pts.map(it => it.avg), maxV = Math.max(1, ...vals, guide || 0);
  const X = i => pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1)), Y = v => H - pb - (v / maxV) * (H - pt - pb);
  const man = v => v >= 10000 ? Math.round(v / 10000).toLocaleString('ko-KR') + '만' : won(v);
  const path = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const dots = vals.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i === n - 1 ? 3.4 : 2.2}" fill="#1b3a6b"/>`).join('');
  const grid = [0, 0.5, 1].map(f => { const yy = Y(maxV * f);
    return `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W - pr}" y2="${yy.toFixed(1)}" stroke="#eee"/>`
         + `<text x="${pl - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#aaa">${man(maxV * f)}</text>`; }).join('');
  const step = Math.max(1, Math.ceil(n / 8));
  const xl = pts.map((it, i) => (i % step === 0 || i === n - 1)
    ? `<text x="${X(i).toFixed(1)}" y="${H - pb + 14}" text-anchor="middle" font-size="8.5" fill="#aaa">${it.date}</text>` : '').join('');
  const guideLine = guide ? `<line x1="${pl}" y1="${Y(guide).toFixed(1)}" x2="${W - pr}" y2="${Y(guide).toFixed(1)}" stroke="#e03131" stroke-width="1.5" stroke-dasharray="5 3"/>`
    + `<text x="${W - pr}" y="${(Y(guide) - 4).toFixed(1)}" text-anchor="end" font-size="9" fill="#e03131">기대 ${man(guide)}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${grid}${xl}${guideLine}
    <path d="${path}" fill="none" stroke="#1b3a6b" stroke-width="2.4" stroke-linejoin="round"/>${dots}</svg>`;
}

// 로컬 /daily-report 와 동일한 구성·라벨·순서로 렌더
function renderNew(r, receivedAt) {
  window._rep = r;
  const p = (r.report_date || '').split('-');
  document.getElementById('title').textContent = '진헬스건강검진센터 일일보고';

  const m = r.monthly || {}, nx = r.next_month || {};
  const pj = m.projected || { cnt: 0, amt: 0 };
  const sTot = (m.sales && m.sales.total) || m.sales_total || {};
  const uTot = (m.upcoming && m.upcoming.total) || m.upcoming_total || {};
  let html = '';

  // 금일 — 분류 클릭 시 작년 대비 수검인원(payload compare.categories)
  const dLabel = p.length === 3 ? `${+p[1]}월${+p[2]}일 일일 검진 현황` : '일일 검진 현황';
  html += `<div class="sec">${dLabel}</div>${groupTable(r.today || {}, null, 'categories')}`;

  // 월간 — 예상매출 제목 + 카드(매출+예약+예측=갭반영, 총액만)
  const mo = +((m.month || r.report_date || '').split('-')[1]) || '';
  html += `<div class="sec">${mo ? mo + '월 ' : ''}예상 매출</div>`;
  const fc = r.forecast || {};
  if (fc.gap_total != null) {
    html += `<div class="proj"><div class="k">예상 매출 (매출 + 예약 + 예측)</div>
      <div class="v">${won(fc.gap_total)}원</div></div>`;
  } else {
    html += `<div class="proj"><div class="k">예상 매출 (매출 + 예약)</div>
      <div class="v">${won(pj.amt)}원</div></div>`;
  }
  if (r.forecast && r.forecast.days && r.forecast.days.length) {
    html += forecastBlock(r.forecast);
  }

  // 이번달(당월) 매출
  const salesTtl = (mo ? mo + '월' : '이번달') + ' 누적 매출';
  if (m.sales && m.sales.groups) {
    html += `<div class="sec">${salesTtl} <span class="rng">${m.sales_period || ''}</span>${chip('revenue')}</div>${groupTable(m.sales, null, 'categories')}`;
  } else {
    html += `<div class="line"><span class="lb">${salesTtl} ${m.sales_period || ''}</span>
      <span><b>${won(sTot.amt)}</b>원 · ${won(sTot.cnt)}명</span></div>`;
  }

  // 1일 예약금액 (최근 7일) — 남은 예약 표는 제거
  if (r.daily_res && r.daily_res.length) {
    html += `<div class="sec">1일 예약금액</div>${bars(r.daily_res, r.daily_res_trend, r.daily_res_guide)}`;
  }

  // 익월 예약 — 합계 + 작년 '같은 시점(오늘)' 대비
  const nr = r.next_resv || {};
  if (nr.month) {
    const cur = nr.cur_amt || 0, prev = nr.prev_amt || 0, diff = cur - prev;
    const pct = prev ? Math.round(diff / prev * 100) : 0, up = diff >= 0;
    const col = up ? '#1b7a3a' : '#c0392b';
    html += `<div class="sec">${nr.month}월 예약</div>
      <div class="card" style="padding:12px 14px;">
        <div style="font-size:21px;font-weight:800;">${won(cur)}원
          <span style="font-size:13px;font-weight:600;color:var(--muted);">· ${won(nr.cur_cnt)}건</span></div>
        <div style="margin-top:5px;font-size:13px;color:${col};">
          작년 오늘까지 ${won(prev)}원 · ${up ? '▲' : '▼'} ${won(Math.abs(diff))}원 (${up ? '+' : ''}${pct}%)</div></div>`;
  } else {
    const nMo = +((nx.month || '').split('-')[1]) || '';
    html += `<div class="line"><span class="lb">${nMo ? nMo + '월' : '익월'} 예약 합계</span>
      <span><b>${won((nx.total || {}).amt)}</b>원 · ${won((nx.total || {}).cnt)}명</span></div>`;
  }

  document.getElementById('content').innerHTML = html;
}

// 재무 · 잔고 — 보고자가 폰에서 직접 입력해 맨 아래에 저장 (날짜별)
function renderBalance(date, balance) {
  const has = balance !== null && balance !== undefined && balance !== '';
  const wrap = document.createElement('div');
  wrap.innerHTML =
    `<div class="sec">재무 · 잔고 <span class="rng">보고자 직접 입력</span></div>
     <div class="fin-box">
       <input id="balInput" type="text" inputmode="numeric" placeholder="잔고 입력"
              value="${has ? won(balance) : ''}">
       <span class="unit">원</span>
       <button id="balSave">저장</button>
     </div>
     <div class="fin-msg" id="balMsg">${has ? '저장됨' : '아직 입력되지 않음'}</div>`;
  document.getElementById('content').appendChild(wrap);
  const input = wrap.querySelector('#balInput');
  input.addEventListener('input', () => {
    const n = input.value.replace(/[^0-9]/g, '');
    input.value = n ? Number(n).toLocaleString('ko-KR') : '';
  });
  wrap.querySelector('#balSave').onclick = () => {
    const raw = input.value.replace(/[^0-9]/g, '');
    const msg = wrap.querySelector('#balMsg');
    msg.textContent = '저장 중…';
    fetch(`/api/reports/${encodeURIComponent(date)}/balance?k=${encodeURIComponent(kTok)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ balance: raw === '' ? null : Number(raw) })
    }).then(r => r.json()).then(d => {
      msg.textContent = d.success ? '✅ 저장되었습니다' : ('⚠️ ' + (d.error || '저장 실패'));
    }).catch(e => { msg.textContent = '⚠️ ' + e.message; });
  };
}

// 구 형식(월별 cnt/amt 12칸) 폴백 — 새 데이터 push 전 호환
function renderLegacy(r, receivedAt) {
  document.getElementById('title').textContent = `일일보고 ${r.report_date || ''}`;
  const cnt = r.cnt || [], amt = r.amt || [];
  let sumC = 0, sumA = 0, rows = '';
  for (let i = 0; i < 12; i++) {
    const c = cnt[i] || 0, a = amt[i] || 0; sumC += c; sumA += a;
    if (!c && !a) continue;
    rows += `<tr><td>${i + 1}월</td><td>${won(c)}</td><td class="num-amt">${won(a)}</td></tr>`;
  }
  document.getElementById('content').innerHTML = `<div class="card"><table>
    <thead><tr><th>월</th><th>건수</th><th>금액</th></tr></thead>
    <tbody>${rows}<tr class="total"><td>합계</td><td>${won(sumC)}</td>
    <td class="num-amt">${won(sumA)}</td></tr></tbody></table></div>
    ${r.memo ? `<div class="sec">메모</div><div class="line">${r.memo}</div>` : ''}`;
}

// ── 확인 / 수정 요청 ──
function renderApprove(reportDate, token) {
  const box = document.getElementById('approveBox');
  box.style.display = 'block';
  box.className = 'approve-bar';
  box.innerHTML = `
    <div class="who">보고서를 검토하셨으면 아래에서 선택해 주세요.</div>
    <div class="approve-btns" id="apMain">
      <button class="btn-ok" id="apConfirm">확인</button>
      <button class="btn-no" id="apRevise">수정 요청</button>
    </div>
    <div id="apPanel"></div>
    <div id="apMsg"></div>`;
  const panel = document.getElementById('apPanel');
  const msg = document.getElementById('apMsg');
  const main = document.getElementById('apMain');

  function showPanel(isConfirm) {
    main.style.display = 'none';
    panel.innerHTML = `
      <div class="ap-panel">
        <div class="ap-q">${isConfirm ? '내용을 확인하셨습니까?' : '수정을 요청하시겠습니까?'}</div>
        <textarea id="apNote" rows="2" placeholder="${isConfirm ? '남기실 의견이 있으면 입력하세요 (선택)' : '수정 의견을 입력하세요 (선택)'}"></textarea>
        <div class="approve-btns">
          <button class="${isConfirm ? 'btn-ok' : 'btn-no'}" id="apDo">${isConfirm ? '확인' : '수정 요청'}</button>
          <button class="btn-cancel" id="apCancel">취소</button>
        </div>
      </div>`;
    document.getElementById('apCancel').onclick = () => { panel.innerHTML = ''; main.style.display = 'flex'; };
    document.getElementById('apDo').onclick = () => {
      const note = (document.getElementById('apNote').value || '').trim();
      submit(isConfirm ? 'approve' : 'reject', note);
    };
  }

  function submit(action, reason) {
    document.getElementById('apDo').disabled = true;
    msg.className = 'approve-msg info'; msg.textContent = '처리 중…';
    fetch(`/api/approvals/${encodeURIComponent(reportDate)}/action`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, action, reason })
    }).then(r => r.json()).then(d => {
      panel.innerHTML = '';
      if (d.success && d.action === 'approve') {
        msg.className = 'approve-msg ok';
        msg.textContent = d.completed
          ? '✅ 최종 확인 완료. 보고가 마감되었습니다.'
          : '✅ 확인했습니다. 다음 담당자에게 전달됩니다.';
      } else if (d.success && d.action === 'reject') {
        msg.className = 'approve-msg no';
        msg.textContent = '📝 수정 요청이 담당자에게 전달되었습니다.';
      } else {
        msg.className = 'approve-msg no';
        msg.textContent = '⚠️ ' + (d.error || '처리 실패');
        main.style.display = 'flex';
      }
    }).catch(e => { msg.className = 'approve-msg no'; msg.textContent = '⚠️ ' + e.message; main.style.display = 'flex'; });
  }

  document.getElementById('apConfirm').onclick = () => showPanel(true);
  document.getElementById('apRevise').onclick = () => showPanel(false);
}

function showApproveMsg(kind, text) {
  const box = document.getElementById('approveBox');
  box.style.display = 'block';
  box.className = 'approve-bar';
  box.innerHTML = `<div class="approve-msg ${kind}">${text}</div>`;
}

// 링크 재오픈 시: 내 결재 상태를 먼저 확인해 버튼/문구를 결정
function setupApprove(reportDate, token) {
  fetch(`/api/approvals/${encodeURIComponent(reportDate)}/mystate?token=${encodeURIComponent(token)}`)
    .then(r => r.json()).then(st => {
      if (!st.valid) return;                       // 잘못된 링크 → 결재 UI 없이 보고서만
      if (st.my_state === 'approved') showApproveMsg('ok', '✅ 이미 확인하신 보고입니다.');
      else if (st.my_state === 'rejected') showApproveMsg('no', '📝 이미 수정 요청하신 보고입니다.');
      else if (st.is_current) renderApprove(reportDate, token);
      else if (st.is_waiting) showApproveMsg('info', '앞 단계 확인이 끝나면 결재하실 수 있습니다.');
      else showApproveMsg('info', '이미 종료된 보고입니다.');
    }).catch(() => renderApprove(reportDate, token));  // 조회 실패 시 버튼 노출(서버가 최종 검증)
}

// ═══════════════ 날짜 이동 (전일 보기) ═══════════════
let kTok = '';
let allDates = [];        // 발행된 날짜 (내림차순)
let curDate = null;       // 현재 보고 있는 report_date
let approveToken = null;  // 결재 토큰 (링크에 있을 때만)
let approveDate = null;   // 결재 대상 날짜 (이 날짜에서만 결재 UI 노출)

async function fetchDates() {
  try {
    const r = await fetch(`/api/reports?k=${encodeURIComponent(kTok)}`);
    const d = await r.json();
    if (d.success && Array.isArray(d.dates)) allDates = d.dates;
  } catch (e) { /* 목록 실패 시 네비 비활성 */ }
}

function updateDaybar() {
  const bar = document.getElementById('daybar');
  if (!curDate) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const p = curDate.split('-');
  const wd = WD[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  const isLatest = allDates.length ? curDate === allDates[0] : true;
  document.getElementById('dLabel').innerHTML =
    `${+p[1]}월 ${+p[2]}일 <span class="dw">(${wd})</span>` +
    (isLatest ? '' : ' <span class="dprev">· 전일보고</span>');
  const idx = allDates.indexOf(curDate);
  // 내림차순: 더 과거 = idx+1, 더 최근 = idx-1
  document.getElementById('dPrev').disabled = !(idx >= 0 && idx < allDates.length - 1);
  document.getElementById('dNext').disabled = !(idx > 0);
}

function stepDay(delta) {  // -1 = 전일(과거), +1 = 익일(최근)
  const idx = allDates.indexOf(curDate);
  if (idx < 0) return;
  const ni = idx + (delta < 0 ? 1 : -1);
  if (ni < 0 || ni >= allDates.length) return;
  loadReport(allDates[ni]);
}

function gateApproval() {
  const box = document.getElementById('approveBox');
  if (approveToken && curDate && curDate === approveDate) {
    setupApprove(approveDate, approveToken);
  } else {
    box.style.display = 'none';
    box.innerHTML = '';
  }
}

async function loadReport(date) {
  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('content');
  statusEl.style.display = 'block';
  statusEl.textContent = '불러오는 중...';
  const url = date ? `/api/reports/${date}?k=${encodeURIComponent(kTok)}`
                   : `/api/reports/latest?k=${encodeURIComponent(kTok)}`;
  try {
    const resp = await fetch(url);
    if (resp.status === 403) { statusEl.textContent = '접근 권한이 없습니다.'; return; }
    const data = await resp.json();
    if (!data.success) { statusEl.textContent = data.error || '조회 실패'; return; }
    curDate = data.report.report_date;
    (data.report.today ? renderNew : renderLegacy)(data.report, data.received_at);
    renderBalance(curDate, data.balance);
    contentEl.style.display = 'block';
    statusEl.textContent = ''; statusEl.style.display = 'none';
    updateDaybar();
    gateApproval();
  } catch (e) {
    statusEl.textContent = '서버에 연결할 수 없습니다.';
  }
}

(async function () {
  const q = new URLSearchParams(location.search);
  kTok = q.get('k') || '';
  const dateParam = q.get('date');
  approveToken = q.get('approve');
  approveDate = dateParam || null;
  await fetchDates();               // 발행 날짜 목록 (전일 네비용)
  await loadReport(dateParam);      // dateParam 없으면 최신
  if (approveToken && !approveDate) {
    approveDate = curDate;          // 링크에 날짜가 없으면 최신 보고가 결재 대상
    gateApproval();
  }
})();

// 좌우 스와이프로 날짜 이동 (오른쪽=전일, 왼쪽=익일). 입력/결재 영역은 제외.
(function () {
  let sx = null, sy = null;
  addEventListener('touchstart', e => {
    if (e.target.closest && e.target.closest('.fin-box, .approve-bar, #cmpModal')) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) stepDay(dx > 0 ? -1 : 1);
  }, { passive: true });
})();
</script>
</body>
</html>
